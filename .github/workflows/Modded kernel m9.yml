name: Build & Hex-Patch Perfect M9 Pro Image

on:
  workflow_dispatch:

jobs:
  build-and-patch-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                              bison flex libncurses-dev libssl-dev bc libelf-dev \
                              python3 curl gzip bzip2 lzop xz-utils liblz4-tool zstd llvm binutils zip git

      - name: Clone RK3326 Kernel Source
        run: |
          git clone --depth=1 https://github.com/JustEnoughLinuxOS/rk3326-kernel.git -b main kernel_source
          cd kernel_source
          make ARCH=arm64 rk3326_defconfig

      - name: Apply Hardcore Configs & Strip Debug Bloat
        run: |
          cd kernel_source
          # Debugging-Overhead entfernen, um Cache-Effizienz zu maximieren
          sed -i 's/CONFIG_DEBUG_KERNEL=y/# CONFIG_DEBUG_KERNEL is not set/' .config
          sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/' .config
          sed -i 's/CONFIG_PAGE_POISONING=y/# CONFIG_PAGE_POISONING is not set/' .config
          sed -i 's/CONFIG_SLUB_DEBUG=y/# CONFIG_SLUB_DEBUG is not set/' .config
          
          # Low-Latency, 1000Hz Timer & UVC Support aktivieren
          echo "CONFIG_PREEMPT=y" >> .config
          echo "CONFIG_HZ_1000=y" >> .config
          echo "CONFIG_HZ=1000" >> .config
          echo "CONFIG_USB_VIDEO_CLASS=y" >> .config
          
          make ARCH=arm64 olddefconfig

      - name: Compile Kernel with Aggressive LTO & Cortex-A35 Flags
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Maximale Compiler-Optimierungen (-O3, LTO, Frame-Pointer-Entfernung)
          export KCFLAGS="-march=armv8-a+crc+crypto -mtune=cortex-a35 -O3 -pipe -fomit-frame-pointer -flto"
          export LDFLAGS="-flto"
          
          make -j$(nproc) Image

      - name: Unpack & Analyze Kernel Binary (Inspirationsbasis aus Unpack & Disassemble)
        run: |
          curl -sSL https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-vmlinux -o extract-vmlinux
          chmod +x extract-vmlinux
          
          ./extract-vmlinux kernel_source/arch/arm64/boot/Image > vmlinux_uncompressed
          
          echo "=== Kernel Version & Frequenz-Check ==="
          strings vmlinux_uncompressed | grep -i "Linux version" || true
          strings vmlinux_uncompressed | grep -E "1296000|1368000|1512000" | head -n 20 || true

      - name: In-Place Hex-Patching des Kernel-Images (Inspirationsbasis aus Patch2)
        run: |
          python3 - << 'EOF'
          import shutil

          src_image = "kernel_source/arch/arm64/boot/Image"
          target_image = "Image"
          shutil.copyfile(src_image, target_image)

          with open(target_image, "rb") as f:
              data = bytearray(f.read())

          orig_size = len(data)
          print(f"Originale Kernel-Image-Größe: {orig_size} Bytes")

          # Little-Endian Byte-Muster für Frequenzen (1.296.000 kHz -> 1.512.000 kHz)
          f_1296 = b"\x80\xC6\x13\x00"
          f_1512 = b"\xA0\x12\x17\x00"

          c1 = data.count(f_1296)
          print(f"Gefundene Frequenz-Tabellen-Einträge (1.296 GHz): {c1}")
          if c1 > 0:
              data = data.replace(f_1296, f_1512)

          # Fallback-Text-Limits und AVS-Logmeldungen direkt im Binary patchen[cite: 6]
          s_orig = b"set 1.296"
          s_patch = b"set 1.512"
          c2 = data.count(s_orig)
          print(f"Gefundene Text-Limits: {c2}")
          if c2 > 0:
              data = data.replace(s_orig, s_patch)

          if len(data) != orig_size:
              print("FEHLER: Dateigröße hat sich unerwartet verändert!")
              exit(1)

          with open(target_image, "wb") as f:
              f.write(data)

          print("Hex-Patch erfolgreich in das Image-Binary eingebrannt!")
          EOF

      - name: Package Final M9 Pro Image Bundle
        run: |
          mkdir -p final_m9pro_image
          cp Image final_m9pro_image/Image
          
          zip -r m9pro_perfect_optimized_image.zip final_m9pro_image

      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m9pro-perfect-optimized-image
          path: m9pro_perfect_optimized_image.zip
          retention-days: 30
