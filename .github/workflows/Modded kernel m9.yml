name: Build Legacy RK3326 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Compatible GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-12 \
            g++-12 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git

      - name: Prepare Legacy Kernel Source
        run: |
          # Falls sich die Source im Repo befindet, diesen Klon-Schritt anpassen
          # git clone <deine-alte-source-url> kernel_source
          if [ ! -d "kernel_source" ]; then
            echo "Fehler: Ordner kernel_source nicht gefunden!"
            exit 1
          fi

      - name: Apply Comprehensive Legacy Patches
        run: |
          cd kernel_source
          
          # 1. C-Standard auf gnu89 erzwingen (verhindert Inline-Fehler in alten Kerneln)
          sed -i '1i KBUILD_CFLAGS += -std=gnu89 -fno-pie -fno-stack-protector -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration' Makefile
          
          # 2. file2alias.c Syntax-Fehler für moderne Toolchains beheben
          if [ -f scripts/mod/file2alias.c ]; then
            sed -i 's/SIZE_\([a-zA-Z0-9_]*\)/sizeof(struct \1)/g' scripts/mod/file2alias.c
          fi
          
          # 3. Alle -Werror Instanzen global entfernen, damit Warnungen den Build nicht abbrechen
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g' || true
          sed -i 's/-Werror//g' Makefile || true

      - name: Configure Kernel Defconfig
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=gcc-12
          
          # Automatische Erkennung der passenden RK3326-Defconfig
          DEFCONFIG=$(find arch/arm64/configs -name "*rk3326*" -o -name "*odroidgoa*" -o -name "*defconfig*" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            echo "Keine spezifische Defconfig gefunden, nutze Standard."
            make defconfig
          else
            CONFIG_NAME=$(basename "$DEFCONFIG")
            make ${CONFIG_NAME%_defconfig}
          fi

      - name: Compile Kernel, Modules and Device Trees
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=gcc-12
          
          # Maximale Integration durch paralleles Bauen von Image, Modulen und DTBs
          make -j$(nproc) Image modules dtbs

      - name: Collect Build Artifacts
        run: |
          mkdir -p final_output
          cp kernel_source/arch/arm64/boot/Image final_output/
          find kernel_source/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} final_output/ \;

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: legacy-rk3326-kernel-output
          path: final_output/
